:root{--bg:#111827;--panel:#0f172a;--panel2:#111827;--line:#253049;--text:#e5e7eb;--muted:#94a3b8;--accent:#f59e0b;--chip:#1f2937;--chipOn:#334155;--ok:#22c55e;--red:#fb7185}
*{box-sizing:border-box} body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)} a{color:inherit} .app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
.top{padding:14px 16px;background:linear-gradient(180deg,#1f2937,#172033);border-bottom:1px solid var(--line)} .top h1{margin:0;font-size:24px;color:#fbbf24}.top p{margin:4px 0 0;color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:#141b2d;flex-wrap:wrap}.btn,.file{background:#1f2937;color:#e5e7eb;border:1px solid #334155;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}.btn.primary{background:#f59e0b;color:#111827;border-color:#f59e0b}.btn:hover,.file:hover{filter:brightness(1.08)}
.layout{display:grid;grid-template-columns:340px 1fr;min-height:0}.sidebar{border-right:1px solid var(--line);background:#111827;display:flex;flex-direction:column;min-height:0}.pane{padding:12px;border-bottom:1px solid var(--line)} .pane h2{margin:0 0 10px;font-size:14px;color:#cbd5e1}.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 10px;border-radius:999px;border:1px solid #475569;background:var(--chip);font-size:13px;cursor:pointer}.chip.on{background:var(--chipOn);border-color:#64748b}.list{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}.card{border:1px solid #243041;background:#0f172a;border-radius:14px;padding:12px}.card h3{margin:0 0 8px;font-size:15px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.badge{font-size:12px;border-radius:999px;padding:4px 8px;border:1px solid #334155;background:#172033;color:#cbd5e1}.rating{color:#fecaca;background:#3a1620;border-color:#7f1d1d}.gr{color:#fde68a;background:#33270f;border-color:#854d0e}.empty{color:#94a3b8;padding:18px;border:1px dashed #334155;border-radius:14px;text-align:center}
.mapWrap{position:relative}.map{height:100%;width:100%}.hint{position:absolute;left:12px;bottom:12px;z-index:500;background:rgba(15,23,42,.88);border:1px solid #334155;color:#cbd5e1;padding:10px 12px;border-radius:12px;font-size:12px;max-width:320px}
.toggle{position:absolute;left:12px;top:12px;z-index:600}.collapsed .sidebar{display:none}.collapsed .layout{grid-template-columns:1fr}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:absolute;left:0;top:122px;bottom:0;width:min(88vw,340px);z-index:700;box-shadow:0 8px 30px rgba(0,0,0,.35)}.sidebar.hidden{display:none}}

.editorDrawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,92vw);background:#0b1220;border-left:1px solid #334155;z-index:1200;transform:translateX(100%);transition:transform .24s ease;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.35)}
.editorDrawer.show{transform:translateX(0)}
.editorHead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #243041;background:#0f172a}.editorTabs{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid #243041;flex-wrap:wrap}.editorBody{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:#94a3b8}.field input,.field textarea,.field select{padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#111827;color:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{font-size:12px;color:#94a3b8}.row{display:flex;gap:8px;flex-wrap:wrap}.listMini{display:flex;flex-direction:column;gap:8px;max-height:180px;overflow:auto}.itemMini{padding:10px 12px;border:1px solid #243041;background:#0f172a;border-radius:10px;cursor:pointer}.itemMini.on{outline:2px solid #f59e0b}.danger{background:#3b1220;border-color:#7f1d1d;color:#fecaca}

</style></head>
<body><div class="app"><header class="top"><h1>福岡・北九州美食地圖</h1><p>資料外置版：places.json / reviews.json / config.json</p></header>
<div class="toolbar"><button class="btn" id="toggleSide">☰ 地點列表</button><input class="file" type="file" id="importPlaces" accept="application/json"><input class="file" type="file" id="importReviews" accept="application/json"><button class="btn" id="exportPlaces">⇩ 匯出 places</button><button class="btn" id="exportReviews">⇩ 匯出 reviews</button><button class="btn" id="openEditor">✎ 編輯資料</button><button class="btn primary" id="resetData">重載預設資料</button></div>
<div class="layout" id="layout"><aside class="sidebar" id="sidebar"><div class="pane"><h2>搜尋</h2><input id="search" class="search" placeholder="搜尋地點名稱、標籤、地區…"></div><div class="pane"><h2>分類</h2><div class="chips" id="catChips"></div></div><div class="pane"><h2>地區</h2><div class="chips" id="regionChips"></div></div><div class="pane"><h2>價格</h2><div class="chips" id="priceChips"></div></div><div class="list" id="list"></div></aside><main class="mapWrap"><button class="btn toggle" id="toggleSide2">◀</button><div id="map" class="map"></div><div class="hint">建議管理方式：平時改 <b>places.json</b> 與 <b>reviews.json</b>，HTML 唔再硬編碼資料。可直接用匯入按鈕更新。</div></main></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
let placesDoc={schema_version:1,places:[]}, reviewsDoc={schema_version:1,reviews:[]}, configDoc={categories:[],prices:[],regions:[]};
let selectedCat='all', selectedRegion='all', selectedPrice='all', q=''; let map, layer;
const el=id=>document.getElementById(id);
function dl(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href)}
async function loadJson(path,fallback){ try{ const r=await fetch(path); if(!r.ok) throw 0; return await r.json(); }catch(e){ return fallback; } }
function uniq(arr){ return [...new Set(arr.filter(Boolean))]; }
function normPlace(p){ return {...p, category:p.category||p.cuisine||'其他', ratings:p.ratings||{}, tags:p.tags||[], links:p.links||{}, region:p.region||'其他地區', price:p.price||'', source:p.source||'自己'}; }
function markerHtml(p){ const colors={拉麵:'#fc8181',壽司:'#63b3ed',燒鳥:'#fbd38d',天婦羅:'#68d391',居酒屋:'#b794f4',咖啡:'#f6e05e',博多料理:'#f6ad55',住宿:'#81e6d9',麵包:'#f6c090',甜品:'#f687b3',烏冬:'#90cdf4',丼飯:'#c6f6d5',燒肉:'#fb923c',景點:'#93c5fd',其他:'#a0aec0'}; const emoji={拉麵:'🍜',壽司:'🍣',燒鳥:'🍢',天婦羅:'🍤',居酒屋:'🍺',咖啡:'☕',博多料理:'🥢',住宿:'🏨',麵包:'🥐',甜品:'🍡',烏冬:'🍝',丼飯:'🍱',燒肉:'🥩',景點:'📍',其他:'📍'}; const c=colors[p.category]||'#a0aec0', e=emoji[p.category]||'📍'; return L.divIcon({html:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 48" width="36" height="48"><path d="M18 0C8.059 0 0 8.059 0 18c0 13.5 18 30 18 30s18-16.5 18-30C36 8.059 27.941 0 18 0z" fill="${c}" stroke="white" stroke-width="2"/><text x="18" y="24" text-anchor="middle" font-size="14" dominant-baseline="middle">${e}</text></svg>`,className:'',iconSize:[36,48],iconAnchor:[18,48],popupAnchor:[0,-48]}); }
function filters(p){ const hay=[p.name,p.region,p.category,p.source,(p.tags||[]).join(' ')].join(' ').toLowerCase(); return (selectedCat==='all'||p.category===selectedCat)&&(selectedRegion==='all'||p.region===selectedRegion)&&(selectedPrice==='all'||p.price===selectedPrice)&&(!q||hay.includes(q)); }
function popupHtml(p){ const rv=reviewsDoc.reviews.filter(r=>r.place_id===p.id||r.place_name===p.name).slice(0,3); const links=[]; for(const [k,v] of Object.entries(p.links||{})){ if(v) links.push(`<a href="${v}" target="_blank" rel="noopener noreferrer">${k}</a>`)} return `<div style="min-width:240px"><b>${p.name}</b><br>${p.category} · ${p.region}${p.price?` · ${p.price}`:''}<br>${p.ratings?.tabelog?`食べログ ${p.ratings.tabelog}`:''}${p.ratings?.google?` / Google ${p.ratings.google}`:''}<br><div style="margin:6px 0;color:#475569">${p.note||''}</div><div>${links.join(' · ')}</div>${rv.length?`<hr><div><b>最近評論</b>${rv.map(r=>`<div style='margin-top:6px'>⭐ ${r.overall_rating||'-'} · ${r.source||''}<br>${r.review_text||''}</div>`).join('')}</div>`:''}</div>`; }
function renderChips(id, values, selected, setter){ const box=el(id); box.innerHTML=''; [['all','全部'],...values.map(v=>[v,v])].forEach(([val,label])=>{ const b=document.createElement('button'); b.className='chip'+(selected===val?' on':''); b.textContent=label; b.onclick=()=>{ setter(val); renderAll(); }; box.appendChild(b); }); }
function renderList(items){ const box=el('list'); box.innerHTML=''; if(!items.length){ box.innerHTML='<div class="empty">目前篩選結果為 0。可重置篩選，或者確認 places.json 內容。</div>'; return;} items.forEach(p=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML=`<h3>${p.name}</h3><div class='meta'><span class='badge'>${p.category}</span><span class='badge'>${p.region}</span>${p.price?`<span class='badge'>${p.price}</span>`:''}${p.ratings?.tabelog?`<span class='badge rating'>食べログ ${p.ratings.tabelog}</span>`:''}${p.ratings?.google?`<span class='badge gr'>Google ${p.ratings.google}</span>`:''}</div><div style='color:#94a3b8;font-size:13px'>${(p.tags||[]).join(' · ')}</div>`; d.onclick=()=>{ map.flyTo([p.lat,p.lng],16,{duration:.5}); }; box.appendChild(d); }); }
function renderMap(items){ if(layer) layer.clearLayers(); else layer=L.layerGroup().addTo(map); items.forEach(p=>{ if(p.lat==null||p.lng==null) return; L.marker([p.lat,p.lng],{icon:markerHtml(p)}).bindPopup(popupHtml(p)).addTo(layer); }); if(items.length){ const group=new L.featureGroup(layer.getLayers()); map.fitBounds(group.getBounds().pad(0.15)); } }
function renderAll(){ const items=placesDoc.places.map(normPlace).filter(filters); renderChips('catChips', uniq((configDoc.categories?.length?configDoc.categories:placesDoc.places.map(p=>p.category||p.cuisine))), selectedCat, v=>selectedCat=v); renderChips('regionChips', uniq((configDoc.regions?.length?configDoc.regions:placesDoc.places.map(p=>p.region))), selectedRegion, v=>selectedRegion=v); renderChips('priceChips', uniq((configDoc.prices?.length?configDoc.prices:placesDoc.places.map(p=>p.price))), selectedPrice, v=>selectedPrice=v); renderList(items); renderMap(items); }
function attachImport(inputId, assigner){ el(inputId).addEventListener('change', async ev=>{ const f=ev.target.files[0]; if(!f) return; const txt=await f.text(); const data=JSON.parse(txt); assigner(data); renderAll(); }); }
async function boot(){
  placesDoc = await loadJson('./places.json',{schema_version:1,places:[]});
  reviewsDoc = await loadJson('./reviews.json',{schema_version:1,reviews:[]});
  configDoc = await loadJson('./config.json',{schema_version:1,categories:[],prices:[],regions:[]});
  map=L.map('map',{zoomControl:true}).setView([33.5904,130.4017],12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  el('search').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase(); renderAll();});
  el('toggleSide').onclick=el('toggleSide2').onclick=()=>{ const sb=el('sidebar'); sb.classList.toggle('hidden'); document.body.classList.toggle('collapsed'); setTimeout(()=>map.invalidateSize(),220); };
  el('exportPlaces').onclick=()=>dl('places.json',placesDoc); el('exportReviews').onclick=()=>dl('reviews.json',reviewsDoc);
  el('resetData').onclick=async()=>{ placesDoc = await loadJson('./places.json',placesDoc); reviewsDoc = await loadJson('./reviews.json',reviewsDoc); configDoc = await loadJson('./config.json',configDoc); selectedCat=selectedRegion=selectedPrice='all'; q=''; el('search').value=''; renderAll(); };
  attachImport('importPlaces', data=>{ placesDoc = data.places?data:{schema_version:1,places:data}; });
  attachImport('importReviews', data=>{ reviewsDoc = data.reviews?data:{schema_version:1,reviews:data.features?data.features.map((f,i)=>({id:`import-${i+1}`,place_name:f.properties?.location?.name,place_id:null,date:f.properties?.date,source:'Google評論',overall_rating:f.properties?.five_star_rating_published,review_text:f.properties?.review_text_published,google_maps_url:f.properties?.google_maps_url,address:f.properties?.location?.address,coordinates:f.geometry?.coordinates,questions:f.properties?.questions||[]})):data}; });
  renderAll();
}

let currentPlaceId=null, currentReviewId=null;
function fillPlaceList(){ const box=el('placeMiniList'); box.innerHTML=''; placesDoc.places.forEach(p=>{ const d=document.createElement('div'); d.className='itemMini'+(String(currentPlaceId)===String(p.id)?' on':''); d.textContent=`${p.name} · ${p.region||''}`; d.onclick=()=>{currentPlaceId=p.id; loadPlaceForm(p); fillPlaceList();}; box.appendChild(d);}); }
function fillReviewList(){ const box=el('reviewMiniList'); box.innerHTML=''; reviewsDoc.reviews.forEach(r=>{ const d=document.createElement('div'); d.className='itemMini'+(String(currentReviewId)===String(r.id)?' on':''); d.textContent=`${r.place_name||r.place_id||'(未連結)'} · ${r.date||''}`; d.onclick=()=>{currentReviewId=r.id; loadReviewForm(r); fillReviewList();}; box.appendChild(d);}); }
function loadPlaceForm(p={ratings:{},links:{}}){ el('ep-id').value=p.id||''; el('ep-name').value=p.name||''; el('ep-category').value=p.category||''; el('ep-region').value=p.region||''; el('ep-lat').value=p.lat??''; el('ep-lng').value=p.lng??''; el('ep-price').value=p.price||''; el('ep-source').value=p.source||''; el('ep-tabelog').value=p.ratings?.tabelog??''; el('ep-google').value=p.ratings?.google??''; el('ep-tags').value=(p.tags||[]).join(', '); el('ep-note').value=p.note||''; el('ep-maps').value=p.links?.maps||''; el('ep-ig').value=p.links?.ig||''; el('ep-fb').value=p.links?.fb||''; el('ep-blog').value=p.links?.blog||''; el('ep-tabelog-link').value=p.links?.tabelog||''; }
function collectPlaceForm(){ return { id:el('ep-id').value.trim()||`p-${Date.now()}`, name:el('ep-name').value.trim(), category:el('ep-category').value.trim()||'其他', region:el('ep-region').value.trim()||'其他地區', lat:parseFloat(el('ep-lat').value), lng:parseFloat(el('ep-lng').value), price:el('ep-price').value.trim(), source:el('ep-source').value.trim()||'自己', ratings:{ tabelog:el('ep-tabelog').value?parseFloat(el('ep-tabelog').value):null, google:el('ep-google').value?parseFloat(el('ep-google').value):null }, tags:el('ep-tags').value.split(',').map(s=>s.trim()).filter(Boolean), note:el('ep-note').value.trim(), links:{ maps:el('ep-maps').value.trim(), ig:el('ep-ig').value.trim(), fb:el('ep-fb').value.trim(), blog:el('ep-blog').value.trim(), tabelog:el('ep-tabelog-link').value.trim() } }; }
function loadReviewForm(r={}){ el('er-id').value=r.id||''; el('er-place-id').value=r.place_id||''; el('er-place-name').value=r.place_name||''; el('er-source').value=r.source||''; el('er-date').value=r.date||''; el('er-rating').value=r.overall_rating??''; el('er-gmap').value=r.google_maps_url||''; el('er-text').value=r.review_text||''; }
function collectReviewForm(){ return { id:el('er-id').value.trim()||`r-${Date.now()}`, place_id:el('er-place-id').value.trim()||null, place_name:el('er-place-name').value.trim()||null, source:el('er-source').value.trim()||'自己', date:el('er-date').value.trim(), overall_rating:el('er-rating').value?parseFloat(el('er-rating').value):null, google_maps_url:el('er-gmap').value.trim(), review_text:el('er-text').value.trim(), questions:[] }; }
function upsertById(arr,obj){ const i=arr.findIndex(x=>String(x.id)===String(obj.id)); if(i>=0) arr[i]=obj; else arr.unshift(obj); }
function removeById(arr,id){ const i=arr.findIndex(x=>String(x.id)===String(id)); if(i>=0) arr.splice(i,1); }
function openEditor(tab='place'){ el('editorDrawer').classList.add('show'); el('placePanel').style.display=tab==='place'?'flex':'none'; el('reviewPanel').style.display=tab==='review'?'flex':'none'; fillPlaceList(); fillReviewList(); }
el('openEditor').onclick=()=>openEditor('place'); el('closeEditor').onclick=()=>el('editorDrawer').classList.remove('show'); el('tabPlace').onclick=()=>openEditor('place'); el('tabReview').onclick=()=>openEditor('review');
el('newPlace').onclick=()=>{ currentPlaceId=null; loadPlaceForm({ratings:{},links:{}}); openEditor('place'); fillPlaceList(); }; el('newReview').onclick=()=>{ currentReviewId=null; loadReviewForm({}); openEditor('review'); fillReviewList(); };
el('savePlace').onclick=()=>{ const obj=collectPlaceForm(); if(!obj.name||Number.isNaN(obj.lat)||Number.isNaN(obj.lng)) return alert('地點需要名稱、緯度、經度'); upsertById(placesDoc.places,obj); currentPlaceId=obj.id; renderAll(); fillPlaceList(); alert('已更新地點，記得匯出 places.json'); };
el('deletePlace').onclick=()=>{ const id=el('ep-id').value.trim(); if(!id) return; if(!confirm('刪除地點？')) return; removeById(placesDoc.places,id); currentPlaceId=null; loadPlaceForm({ratings:{},links:{}}); renderAll(); fillPlaceList(); };
el('saveReview').onclick=()=>{ const obj=collectReviewForm(); if(!obj.place_id && !obj.place_name) return alert('評論至少要有 place_id 或 place_name'); upsertById(reviewsDoc.reviews,obj); currentReviewId=obj.id; renderAll(); fillReviewList(); alert('已更新評論，記得匯出 reviews.json'); };
el('deleteReview').onclick=()=>{ const id=el('er-id').value.trim(); if(!id) return; if(!confirm('刪除評論？')) return; removeById(reviewsDoc.reviews,id); currentReviewId=null; loadReviewForm({}); renderAll(); fillReviewList(); };

boot();
</script>
<div class="editorDrawer" id="editorDrawer">
  <div class="editorHead"><strong>資料編輯器</strong><button class="btn" id="closeEditor">✕</button></div>
  <div class="editorTabs">
    <button class="btn" id="tabPlace">地點</button>
    <button class="btn" id="tabReview">評論</button>
    <button class="btn" id="newPlace">＋ 新地點</button>
    <button class="btn" id="newReview">＋ 新評論</button>
  </div>
  <div class="editorBody" id="placePanel">
    <div class="field"><label>選擇地點</label><div class="listMini" id="placeMiniList"></div></div>
    <div class="grid2"><div class="field"><label>ID</label><input id="ep-id"></div><div class="field"><label>名稱</label><input id="ep-name"></div></div>
    <div class="grid2"><div class="field"><label>分類</label><input id="ep-category"></div><div class="field"><label>地區</label><input id="ep-region"></div></div>
    <div class="grid2"><div class="field"><label>緯度</label><input id="ep-lat" type="number" step="0.000001"></div><div class="field"><label>經度</label><input id="ep-lng" type="number" step="0.000001"></div></div>
    <div class="grid2"><div class="field"><label>價格</label><input id="ep-price"></div><div class="field"><label>來源</label><input id="ep-source"></div></div>
    <div class="grid2"><div class="field"><label>Tabelog</label><input id="ep-tabelog" type="number" step="0.01"></div><div class="field"><label>Google</label><input id="ep-google" type="number" step="0.1"></div></div>
    <div class="field"><label>標籤（逗號分隔）</label><input id="ep-tags"></div>
    <div class="field"><label>備註</label><textarea id="ep-note" rows="3"></textarea></div>
    <div class="field"><label>Maps 連結</label><input id="ep-maps"></div>
    <div class="field"><label>IG 連結</label><input id="ep-ig"></div>
    <div class="field"><label>Facebook 連結</label><input id="ep-fb"></div>
    <div class="field"><label>Blog 連結</label><input id="ep-blog"></div>
    <div class="field"><label>Tabelog 連結</label><input id="ep-tabelog-link"></div>
    <div class="row"><button class="btn primary" id="savePlace">儲存地點</button><button class="btn danger" id="deletePlace">刪除地點</button></div>
    <div class="mini">儲存後可用「⇩ 匯出 places」下載最新 places.json。</div>
  </div>
  <div class="editorBody" id="reviewPanel" style="display:none">
    <div class="field"><label>選擇評論</label><div class="listMini" id="reviewMiniList"></div></div>
    <div class="grid2"><div class="field"><label>ID</label><input id="er-id"></div><div class="field"><label>對應地點 ID</label><input id="er-place-id"></div></div>
    <div class="grid2"><div class="field"><label>地點名稱</label><input id="er-place-name"></div><div class="field"><label>來源</label><input id="er-source"></div></div>
    <div class="grid2"><div class="field"><label>日期</label><input id="er-date"></div><div class="field"><label>總評分</label><input id="er-rating" type="number" step="0.1"></div></div>
    <div class="field"><label>Google Maps URL</label><input id="er-gmap"></div>
    <div class="field"><label>評論內容</label><textarea id="er-text" rows="5"></textarea></div>
    <div class="row"><button class="btn primary" id="saveReview">儲存評論</button><button class="btn danger" id="deleteReview">刪除評論</button></div>
    <div class="mini">儲存後可用「⇩ 匯出 reviews」下載最新 reviews.json。</div>
  </div>
</div>

</body></html>
