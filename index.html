:root{--bg:#111827;--panel:#0f172a;--panel2:#111827;--line:#253049;--text:#e5e7eb;--muted:#94a3b8;--accent:#f59e0b;--chip:#1f2937;--chipOn:#334155;--ok:#22c55e;--red:#fb7185}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}a{color:inherit}.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}.top{padding:14px 16px;background:linear-gradient(180deg,#1f2937,#172033);border-bottom:1px solid var(--line)}.top h1{margin:0;font-size:24px;color:#fbbf24}.top p{margin:4px 0 0;color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:#141b2d;flex-wrap:wrap}.btn,.file{background:#1f2937;color:#e5e7eb;border:1px solid #334155;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}.btn.primary{background:#f59e0b;color:#111827;border-color:#f59e0b}.btn:hover,.file:hover{filter:brightness(1.08)}.layout{display:grid;grid-template-columns:340px 1fr;min-height:0;height:calc(100vh - 106px)}.sidebar{border-right:1px solid var(--line);background:#111827;display:flex;flex-direction:column;min-height:0}.pane{padding:12px;border-bottom:1px solid var(--line)}.pane h2{margin:0 0 10px;font-size:14px;color:#cbd5e1}.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 10px;border-radius:999px;border:1px solid #475569;background:var(--chip);font-size:13px;cursor:pointer}.chip.on{background:var(--chipOn);border-color:#64748b}.list{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}.card{border:1px solid #243041;background:#0f172a;border-radius:14px;padding:12px;cursor:pointer}.card h3{margin:0 0 8px;font-size:15px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.badge{font-size:12px;border-radius:999px;padding:4px 8px;border:1px solid #334155;background:#172033;color:#cbd5e1}.rating{color:#fecaca;background:#3a1620;border-color:#7f1d1d}.gr{color:#fde68a;background:#33270f;border-color:#854d0e}.empty{color:#94a3b8;padding:18px;border:1px dashed #334155;border-radius:14px;text-align:center}.mapWrap{position:relative;min-height:0}.map{height:100%;width:100%}.hint{position:absolute;left:12px;bottom:12px;z-index:500;background:rgba(15,23,42,.88);border:1px solid #334155;color:#cbd5e1;padding:10px 12px;border-radius:12px;font-size:12px;max-width:320px}.toggle{position:absolute;left:12px;top:12px;z-index:600}.collapsed .sidebar{display:none}.collapsed .layout{grid-template-columns:1fr}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:absolute;left:0;top:106px;bottom:0;width:min(88vw,340px);z-index:700;box-shadow:0 8px 30px rgba(0,0,0,.35)}.sidebar.hidden{display:none}}.editorDrawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,92vw);background:#0b1220;border-left:1px solid #334155;z-index:1200;transform:translateX(100%);transition:transform .24s ease;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.35)}.editorDrawer.show{transform:translateX(0)}.editorHead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #243041;background:#0f172a}.editorTabs{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid #243041;flex-wrap:wrap}.editorBody{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:#94a3b8}.field input,.field textarea{padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#111827;color:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{font-size:12px;color:#94a3b8}.row{display:flex;gap:8px;flex-wrap:wrap}.listMini{display:flex;flex-direction:column;gap:8px;max-height:180px;overflow:auto}.itemMini{padding:10px 12px;border:1px solid #243041;background:#0f172a;border-radius:10px;cursor:pointer}.itemMini.on{outline:2px solid #f59e0b}.danger{background:#3b1220;border-color:#7f1d1d;color:#fecaca}

<body>
<div class="app">
<header class="top"><h1>福岡・北九州美食地圖</h1><p>資料來源版： places.json / reviews.json / config.json</p></header>
<div class="toolbar">
<button class="btn" id="toggleSide">☰ 地點列表</button>
<input class="file" type="file" id="importPlaces" accept="application/json">
<input class="file" type="file" id="importReviews" accept="application/json">
<button class="btn" id="exportPlaces">⇩ 匯出 places</button>
<button class="btn" id="exportReviews">⇩ 匯出 reviews</button>
<button class="btn" id="openEditor">✎ 編輯資料</button>
<button class="btn primary" id="resetData">重載預設資料</button>
</div>
<div class="layout" id="layout">
<aside class="sidebar" id="sidebar">
<div class="pane"><h2>搜尋</h2><input id="search" class="search" placeholder="搜尋地點名稱、標籤、地區…"></div>
<div class="pane"><h2>分類</h2><div class="chips" id="catChips"></div></div>
<div class="pane"><h2>地區</h2><div class="chips" id="regionChips"></div></div>
<div class="pane"><h2>價格</h2><div class="chips" id="priceChips"></div></div>
<div class="list" id="list"></div>
</aside>
<main class="mapWrap"><button class="btn toggle" id="toggleSide2">◀</button><div id="map" class="map"></div><div class="hint">建議管理方式：平時改 <b>places.json</b> 與 <b>reviews.json</b>，HTML 僅作瀏覽與資料編輯。可直接拖尾匯入較新資料。</div></main>
</div>
<div class="editorDrawer" id="editorDrawer">
<div class="editorHead"><strong>資料編輯器</strong><button class="btn" id="closeEditor">✕</button></div>
<div class="editorTabs"><button class="btn" id="tabPlace">地點</button><button class="btn" id="tabReview">評論</button><button class="btn" id="newPlace">＋ 新地點</button><button class="btn" id="newReview">＋ 新評論</button></div>
<div class="editorBody" id="placePanel">
<div class="field"><label>選擇地點</label><div class="listMini" id="placeMiniList"></div></div>
<div class="grid2"><div class="field"><label>ID</label><input id="ep-id"></div><div class="field"><label>名稱</label><input id="ep-name"></div></div>
<div class="grid2"><div class="field"><label>分類</label><input id="ep-category"></div><div class="field"><label>地區</label><input id="ep-region"></div></div>
<div class="grid2"><div class="field"><label>緯度</label><input id="ep-lat" type="number" step="0.000001"></div><div class="field"><label>經度</label><input id="ep-lng" type="number" step="0.000001"></div></div>
<div class="grid2"><div class="field"><label>價格</label><input id="ep-price"></div><div class="field"><label>來源</label><input id="ep-source"></div></div>
<div class="grid2"><div class="field"><label>Tabelog</label><input id="ep-tabelog" type="number" step="0.01"></div><div class="field"><label>Google</label><input id="ep-google" type="number" step="0.1"></div></div>
<div class="field"><label>標籤（逗號分隔）</label><input id="ep-tags"></div>
<div class="field"><label>備註</label><textarea id="ep-note" rows="3"></textarea></div>
<div class="field"><label>Maps 連結</label><input id="ep-maps"></div>
<div class="field"><label>IG 連結</label><input id="ep-ig"></div>
<div class="field"><label>Facebook 連結</label><input id="ep-fb"></div>
<div class="field"><label>Blog 連結</label><input id="ep-blog"></div>
<div class="field"><label>Tabelog 連結</label><input id="ep-tabelog-link"></div>
<div class="row"><button class="btn primary" id="savePlace">儲存地點</button><button class="btn danger" id="deletePlace">刪除地點</button></div>
<div class="mini">儲存後可用「⇩ 匯出 places」下載最新 places.json。</div>
</div>
<div class="editorBody" id="reviewPanel" style="display:none">
<div class="field"><label>選擇評論</label><div class="listMini" id="reviewMiniList"></div></div>
<div class="grid2"><div class="field"><label>ID</label><input id="er-id"></div><div class="field"><label>對應地點 ID</label><input id="er-place-id"></div></div>
<div class="grid2"><div class="field"><label>地點名稱</label><input id="er-place-name"></div><div class="field"><label>來源</label><input id="er-source"></div></div>
<div class="grid2"><div class="field"><label>日期</label><input id="er-date"></div><div class="field"><label>總評分</label><input id="er-rating" type="number" step="0.1"></div></div>
<div class="field"><label>Google Maps URL</label><input id="er-gmap"></div>
<div class="field"><label>評論內容</label><textarea id="er-text" rows="5"></textarea></div>
<div class="row"><button class="btn primary" id="saveReview">儲存評論</button><button class="btn danger" id="deleteReview">刪除評論</button></div>
<div class="mini">儲存後可用「⇩ 匯出 reviews」下載最新 reviews.json。</div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
let placesDoc={schemaVersion:1,places:[]},reviewsDoc={schemaVersion:1,reviews:[]},configDoc={schemaVersion:1,categories:[],prices:[],regions:[],mapDefaults:{center:[33.5904,130.4017],zoom:12}};
let selectedCat='all',selectedRegion='all',selectedPrice='all',q='';
let map,layer,currentPlaceId=null,currentReviewId=null;
const el=id=>document.getElementById(id);
const uniq=arr=>[...new Set((arr||[]).filter(Boolean))];
function dl(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),600)}
async function loadJson(path,fallback){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return await r.json()}catch{return fallback}}
function normPlace(p){return {...p,category:p.category||p.cuisine||'',ratings:p.ratings||{tabelog:p.tabelog??null,google:p.grating??null},tags:Array.isArray(p.tags)?p.tags:[],links:p.links||{},region:p.region||'',price:p.price||'',source:p.source||''}}
function markerHtml(){return L.divIcon({html:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 48" width="36" height="48"><path d="M18 0C8.059 0 0 8.059 0 18c0 13.5 18 30 18 30s18-16.5 18-30C36 8.059 27.941 0 18 0z" fill="#f59e0b" stroke="white" stroke-width="2"/></svg>',className:'',iconSize:[36,48],iconAnchor:[18,48],popupAnchor:[0,-48]})}
function filters(p){const hay=[p.name,p.region,p.category,p.source,(p.tags||[]).join(' ')].join(' ').toLowerCase();return (selectedCat==='all'||p.category===selectedCat)&&(selectedRegion==='all'||p.region===selectedRegion)&&(selectedPrice==='all'||p.price===selectedPrice)&&(!q||hay.includes(q))}
function popupHtml(p){const rv=(reviewsDoc.reviews||[]).filter(r=>String(r.placeid)===String(p.id)||r.placename===p.name).slice(0,3);const links=[];for(const [k,v] of Object.entries(p.links||{})){if(v)links.push(`<a href="${v}" target="_blank" rel="noopener noreferrer">${k}</a>`)}return `<div style="min-width:240px"><b>${p.name||''}</b><br>${p.category||''} · ${p.region||''}${p.price?` · ${p.price}`:''}<br>${p.ratings?.tabelog?`Tabelog ${p.ratings.tabelog}`:''}${p.ratings?.google?` · Google ${p.ratings.google}`:''}<div style="margin:6px 0;color:#64748b">${p.note||''}</div><div>${links.join(' · ')}</div>${rv.length?`<hr><div><b>評論</b><br>${rv.map(r=>`<div style="margin-top:6px">${r.overallrating??'-'} · ${r.source||''}<br>${r.reviewtext||''}</div>`).join('')}</div>`:''}</div>`}
function renderChips(id,values,selected,setter){const box=el(id);if(!box)return;box.innerHTML='';[['all','全部'],...values.map(v=>[v,v])].forEach(([val,label])=>{const b=document.createElement('button');b.className='chip'+(selected===val?' on':'');b.textContent=label;b.addEventListener('click',()=>{setter(val);renderAll()});box.appendChild(b)})}
function renderList(items){const box=el('list');if(!box)return;box.innerHTML='';if(!items.length){box.innerHTML='<div class="empty">0 個地點</div>';return}items.forEach(p=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<h3>${p.name||''}</h3><div class="meta"><span class="badge">${p.category||''}</span><span class="badge">${p.region||''}</span>${p.price?`<span class="badge">${p.price}</span>`:''}${p.ratings?.tabelog?`<span class="badge rating">Tabelog ${p.ratings.tabelog}</span>`:''}${p.ratings?.google?`<span class="badge gr">Google ${p.ratings.google}</span>`:''}</div><div style="color:#94a3b8;font-size:13px">${(p.tags||[]).join(' · ')}</div>`;d.addEventListener('click',()=>{if(map&&Number.isFinite(+p.lat)&&Number.isFinite(+p.lng))map.flyTo([+p.lat,+p.lng],16,{duration:.5})});box.appendChild(d)})}
function renderMap(items){if(!map)return;if(layer)layer.clearLayers();else layer=L.layerGroup().addTo(map);items.forEach(p=>{if(!Number.isFinite(+p.lat)||!Number.isFinite(+p.lng))return;L.marker([+p.lat,+p.lng],{icon:markerHtml()}).bindPopup(popupHtml(p)).addTo(layer)});if(layer.getLayers().length){const group=L.featureGroup(layer.getLayers());map.fitBounds(group.getBounds().pad(0.15))}}
function renderAll(){const raw=Array.isArray(placesDoc.places)?placesDoc.places:[];const items=raw.map(normPlace).filter(filters);renderChips('catChips',uniq(configDoc.categories?.length?configDoc.categories:raw.map(p=>p.category||p.cuisine)),selectedCat,v=>selectedCat=v);renderChips('regionChips',uniq(configDoc.regions?.length?configDoc.regions:raw.map(p=>p.region)),selectedRegion,v=>selectedRegion=v);renderChips('priceChips',uniq(configDoc.prices?.length?configDoc.prices:raw.map(p=>p.price)),selectedPrice,v=>selectedPrice=v);renderList(items);renderMap(items)}
function attachImport(inputId,assigner){const node=el(inputId);if(!node)return;node.addEventListener('change',async ev=>{const f=ev.target.files?.[0];if(!f)return;const txt=await f.text();const data=JSON.parse(txt);assigner(data);renderAll();ev.target.value=''})}
function fillPlaceList(){const box=el('placeMiniList');if(!box)return;box.innerHTML='';(placesDoc.places||[]).forEach(p=>{const d=document.createElement('div');d.className='itemMini'+(String(currentPlaceId)===String(p.id)?' on':'');d.textContent=`${p.name||''} · ${p.region||''}`;d.addEventListener('click',()=>{currentPlaceId=p.id;loadPlaceForm(p);fillPlaceList()});box.appendChild(d)})}
function fillReviewList(){const box=el('reviewMiniList');if(!box)return;box.innerHTML='';(reviewsDoc.reviews||[]).forEach(r=>{const d=document.createElement('div');d.className='itemMini'+(String(currentReviewId)===String(r.id)?' on':'');d.textContent=`${r.placename||r.placeid||''} · ${r.date||''}`;d.addEventListener('click',()=>{currentReviewId=r.id;loadReviewForm(r);fillReviewList()});box.appendChild(d)})}
function loadPlaceForm(p={ratings:{},links:{},tags:[]}){el('ep-id').value=p.id||'';el('ep-name').value=p.name||'';el('ep-category').value=p.category||'';el('ep-region').value=p.region||'';el('ep-lat').value=p.lat??'';el('ep-lng').value=p.lng??'';el('ep-price').value=p.price||'';el('ep-source').value=p.source||'';el('ep-tabelog').value=p.ratings?.tabelog??p.tabelog??'';el('ep-google').value=p.ratings?.google??p.grating??'';el('ep-tags').value=(p.tags||[]).join(', ');el('ep-note').value=p.note||'';el('ep-maps').value=p.links?.maps||'';el('ep-ig').value=p.links?.ig||'';el('ep-fb').value=p.links?.fb||'';el('ep-blog').value=p.links?.blog||'';el('ep-tabelog-link').value=p.links?.tabelog||''}
function collectPlaceForm(){return{id:el('ep-id').value.trim()||`p-${Date.now()}`,name:el('ep-name').value.trim(),category:el('ep-category').value.trim(),region:el('ep-region').value.trim(),lat:parseFloat(el('ep-lat').value),lng:parseFloat(el('ep-lng').value),price:el('ep-price').value.trim(),source:el('ep-source').value.trim(),ratings:{tabelog:el('ep-tabelog').value?parseFloat(el('ep-tabelog').value):null,google:el('ep-google').value?parseFloat(el('ep-google').value):null},tags:el('ep-tags').value.split(',').map(s=>s.trim()).filter(Boolean),note:el('ep-note').value.trim(),links:{maps:el('ep-maps').value.trim(),ig:el('ep-ig').value.trim(),fb:el('ep-fb').value.trim(),blog:el('ep-blog').value.trim(),tabelog:el('ep-tabelog-link').value.trim()}}}
function loadReviewForm(r={}){el('er-id').value=r.id||'';el('er-place-id').value=r.placeid||'';el('er-place-name').value=r.placename||'';el('er-source').value=r.source||'';el('er-date').value=r.date||'';el('er-rating').value=r.overallrating??'';el('er-gmap').value=r.googlemapsurl||'';el('er-text').value=r.reviewtext||''}
function collectReviewForm(){return{id:el('er-id').value.trim()||`r-${Date.now()}`,placeid:el('er-place-id').value.trim()||null,placename:el('er-place-name').value.trim()||null,source:el('er-source').value.trim(),date:el('er-date').value.trim(),overallrating:el('er-rating').value?parseFloat(el('er-rating').value):null,googlemapsurl:el('er-gmap').value.trim(),reviewtext:el('er-text').value.trim(),questions:[]}}
function upsertById(arr,obj){const i=arr.findIndex(x=>String(x.id)===String(obj.id));if(i>=0)arr[i]=obj;else arr.unshift(obj)}
function removeById(arr,id){const i=arr.findIndex(x=>String(x.id)===String(id));if(i>=0)arr.splice(i,1)}
function openEditor(tab='place'){el('editorDrawer').classList.add('show');el('placePanel').style.display=tab==='place'?'flex':'none';el('reviewPanel').style.display=tab==='review'?'flex':'none';fillPlaceList();fillReviewList()}
async function boot(){placesDoc=await loadJson('./places.json',{schemaVersion:1,places:[]});reviewsDoc=await loadJson('./reviews.json',{schemaVersion:1,reviews:[]});configDoc=await loadJson('./config.json',configDoc);map=L.map('map',{zoomControl:true}).setView(configDoc.mapDefaults?.center||[33.5904,130.4017],configDoc.mapDefaults?.zoom||12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);el('search').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();renderAll()});const toggleFn=()=>{const sb=el('sidebar');sb.classList.toggle('hidden');document.body.classList.toggle('collapsed');setTimeout(()=>map.invalidateSize(),220)};el('toggleSide').addEventListener('click',toggleFn);el('toggleSide2').addEventListener('click',toggleFn);el('exportPlaces').addEventListener('click',()=>dl('places.json',placesDoc));el('exportReviews').addEventListener('click',()=>dl('reviews.json',reviewsDoc));el('resetData').addEventListener('click',async()=>{placesDoc=await loadJson('./places.json',placesDoc);reviewsDoc=await loadJson('./reviews.json',reviewsDoc);configDoc=await loadJson('./config.json',configDoc);selectedCat='all';selectedRegion='all';selectedPrice='all';q='';el('search').value='';renderAll()});attachImport('importPlaces',data=>placesDoc=Array.isArray(data)?{schemaVersion:1,places:data}:data.places?data:{schemaVersion:1,places:[]});attachImport('importReviews',data=>reviewsDoc=Array.isArray(data)?{schemaVersion:1,reviews:data}:data.reviews?data:{schemaVersion:1,reviews:[]});el('openEditor').addEventListener('click',()=>openEditor('place'));el('closeEditor').addEventListener('click',()=>el('editorDrawer').classList.remove('show'));el('tabPlace').addEventListener('click',()=>openEditor('place'));el('tabReview').addEventListener('click',()=>openEditor('review'));el('newPlace').addEventListener('click',()=>{currentPlaceId=null;loadPlaceForm();openEditor('place');fillPlaceList()});el('newReview').addEventListener('click',()=>{currentReviewId=null;loadReviewForm();openEditor('review');fillReviewList()});el('savePlace').addEventListener('click',()=>{const obj=collectPlaceForm();if(!obj.name||!Number.isFinite(obj.lat)||!Number.isFinite(obj.lng))return alert('請填名稱、緯度、經度');upsertById(placesDoc.places,obj);currentPlaceId=obj.id;renderAll();fillPlaceList();alert('places.json 已更新到記憶體，可用匯出下載')});el('deletePlace').addEventListener('click',()=>{const id=el('ep-id').value.trim();if(!id)return;if(!confirm('確定刪除？'))return;removeById(placesDoc.places,id);currentPlaceId=null;loadPlaceForm();renderAll();fillPlaceList()});el('saveReview').addEventListener('click',()=>{const obj=collectReviewForm();if(!obj.placeid&&!obj.placename)return alert('請至少填 placeid 或 placename');upsertById(reviewsDoc.reviews,obj);currentReviewId=obj.id;renderAll();fillReviewList();alert('reviews.json 已更新到記憶體，可用匯出下載')});el('deleteReview').addEventListener('click',()=>{const id=el('er-id').value.trim();if(!id)return;if(!confirm('確定刪除？'))return;removeById(reviewsDoc.reviews,id);currentReviewId=null;loadReviewForm();renderAll();fillReviewList()});renderAll()}
boot();
});
</script>
