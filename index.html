<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>福岡・北九州美食地圖</title><link rel="icon" href="data:,"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"><style>:root{--bg:#111827;--line:#253049;--text:#e5e7eb;--muted:#94a3b8;--accent:#f59e0b}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}body{overflow:hidden}.app{display:grid;grid-template-rows:auto auto 1fr;height:100dvh}.top{padding:12px 14px;background:#172033;border-bottom:1px solid var(--line)}.top h1{margin:0;font-size:20px;color:#fbbf24}.top p{margin:4px 0 0;color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:#141b2d;flex-wrap:wrap}.btn{background:#1f2937;color:#e5e7eb;border:1px solid #334155;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer}.btn.on{background:#92400e;border-color:#f59e0b}.btn.danger{background:#4c1d1d;border-color:#b91c1c;color:#fee2e2}.btn.primary{background:#1e3a5f;border-color:#3b82f6;color:#bfdbfe}.layout{display:grid;grid-template-columns:340px 1fr;min-height:0}.sidebar{border-right:1px solid var(--line);background:#111827;display:flex;flex-direction:column;min-height:0}.pane{padding:10px 12px;border-bottom:1px solid var(--line)}.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #475569;background:#0b1220;color:#fff}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 10px;border-radius:999px;border:1px solid #64748b;background:#172033;color:#e5e7eb;font-size:13px;cursor:pointer}.chip.on{background:#334155;border-color:#94a3b8;color:#fff}.list{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}.card{border:1px solid #334155;background:#0b1220;border-radius:14px;padding:12px;cursor:pointer}.card h3{margin:0 0 8px;font-size:15px;color:#f8fafc;line-height:1.35}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.badge{font-size:12px;border-radius:999px;padding:4px 8px;border:1px solid #475569;background:#1e293b;color:#e2e8f0}.rating{color:#ffe4e6;background:#4c1d28;border-color:#9f1239}.gr{color:#fef3c7;background:#3b2a12;border-color:#a16207}.openBadge{background:#123524;border-color:#166534;color:#dcfce7}.closedBadge{background:#4c1d1d;border-color:#b91c1c;color:#fee2e2}.irregularBadge{background:#3f2a0f;border-color:#b45309;color:#fde68a}.hours{color:#cbd5e1;font-size:12px;line-height:1.5;margin-top:6px}.empty{color:#cbd5e1;padding:18px;border:1px dashed #475569;border-radius:14px;text-align:center}.mapWrap{position:relative;min-height:0}.map{height:100%;width:100%}.toggle{position:absolute;left:12px;top:12px;z-index:760}.hint{position:absolute;left:12px;bottom:12px;z-index:500;background:rgba(15,23,42,.88);border:1px solid #334155;color:#cbd5e1;padding:10px 12px;border-radius:12px;font-size:12px;max-width:280px}.overlay{display:none}.custom-pin{background:transparent!important;border:none!important}.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:transparent}.marker-cluster div{width:38px;height:38px;margin-left:0;margin-top:0;border-radius:50%;background:#f59e0b;border:3px solid #fff;color:#111827;font:700 14px/32px sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.35);text-align:center}.filterSection{border-bottom:1px solid var(--line)}.filterSection summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;color:#e5e7eb;font-size:13px;font-weight:700}.filterSection summary::-webkit-details-marker{display:none}.filterBody{padding:0 12px 12px}.leaflet-bottom.leaflet-right{bottom:12px;right:12px}.leaflet-control-zoom{box-shadow:0 4px 14px rgba(0,0,0,.35)!important}.leaflet-control-layers{background:#111827;color:#e5e7eb;border:1px solid #334155}.leaflet-control-layers-expanded{padding:10px 12px}.leaflet-control-layers label,.leaflet-control-layers-base span{color:#e5e7eb}
/* Editor drawer */
.editorDrawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100vw);background:#0f172a;border-left:1px solid #334155;z-index:900;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease}.editorDrawer.open{transform:translateX(0)}.editorHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #334155;background:#172033}.editorHead strong{color:#fbbf24;font-size:15px}.editorTabs{display:flex;border-bottom:1px solid #334155}.editorTab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;color:#94a3b8;cursor:pointer;border-bottom:2px solid transparent}.editorTab.on{color:#fbbf24;border-color:#f59e0b}.editorBody{flex:1;overflow:auto;padding:14px 16px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:#94a3b8;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #475569;background:#0b1220;color:#e5e7eb;font-size:13px}.field textarea{resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.listMini{display:flex;flex-direction:column;gap:6px}.listMini .mitem{padding:8px 10px;background:#0b1220;border:1px solid #334155;border-radius:8px;cursor:pointer;font-size:13px;color:#e5e7eb}.listMini .mitem.on{border-color:#f59e0b;background:#1c1500}.mini{background:#111827;border-radius:10px;padding:10px;margin-bottom:10px;font-size:13px;color:#cbd5e1}
@media(min-width:901px){.sidebar.hidden{display:flex!important}}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:absolute;left:0;top:140px;bottom:0;width:min(88vw,340px);z-index:780;box-shadow:0 8px 30px rgba(0,0,0,.35)}.sidebar.hidden{display:none!important}.overlay{display:none;position:absolute;inset:0;background:rgba(2,6,23,.42);z-index:740}.overlay.show{display:block}.hint{display:none}}</style></head><body>
<div class="app">
  <header class="top"><h1>福岡・北九州美食地圖</h1><p>資料來源：places.json / reviews.json / config.json</p></header>
  <div class="toolbar">
    <button class="btn" id="toggleSide">☰ 地點列表</button>
    <input class="btn" type="file" id="importPlaces" accept="application/json" style="display:none">
    <input class="btn" type="file" id="importReviews" accept="application/json" style="display:none">
    <button class="btn" id="exportPlaces">⇩ 匯出 places</button>
    <button class="btn" id="exportReviews">⇩ 匯出 reviews</button>
    <button class="btn" id="openEditor">✎ 編輯資料</button>
    <button class="btn primary" id="resetData">重載預設資料</button>
  </div>
  <div class="layout">
    <aside class="sidebar hidden" id="sidebar">
      <div class="pane"><input id="search" class="search" placeholder="搜尋地點名稱、標籤、地區…"></div>
      <details class="filterSection"><summary>分類 <span>⌄</span></summary><div class="filterBody"><div class="chips" id="catChips"></div></div></details>
      <details class="filterSection"><summary>地區 <span>⌄</span></summary><div class="filterBody"><div class="chips" id="regionChips"></div></div></details>
      <details class="filterSection"><summary>價格 <span>⌄</span></summary><div class="filterBody"><div class="chips" id="priceChips"></div></div></details>
      <div class="list" id="list"></div>
    </aside>
    <main class="mapWrap">
      <div id="mapOverlay" class="overlay"></div>
      <button class="btn toggle" id="toggleSide2">☰</button>
      <div id="map" class="map"></div>
      <div class="hint">建議管理方式：平時改 <b>places.json</b> 與 <b>reviews.json</b>，HTML 僅作瀏覽與資料編輯。可直接拖尾匯入較新資料。</div>
    </main>
  </div>
</div>

<!-- Editor Drawer -->
<div class="editorDrawer" id="editorDrawer">
  <div class="editorHead"><strong>資料編輯器</strong><button class="btn" id="closeEditor">✕</button></div>
  <div class="editorTabs">
    <div class="editorTab on" id="tabPlace" onclick="switchTab('place')">地點</div>
    <div class="editorTab" id="tabReview" onclick="switchTab('review')">評論</div>
  </div>
  <div class="editorBody" id="editorBody">
    <!-- Place Panel -->
    <div id="placePanel">
      <div class="mini">儲存後可用「⇩ 匯出 places」下載最新 places.json。</div>
      <div class="listMini" id="placeMiniList"></div>
      <div class="field"><label>ID</label><input id="ep-id"></div>
      <div class="grid2">
        <div class="field"><label>名稱</label><input id="ep-name"></div>
        <div class="field"><label>分類</label><input id="ep-category"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>地區</label><input id="ep-region"></div>
        <div class="field"><label>緯度</label><input id="ep-lat" type="number" step="0.000001"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>經度</label><input id="ep-lng" type="number" step="0.000001"></div>
        <div class="field"><label>價格</label><input id="ep-price"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>來源</label><input id="ep-source"></div>
        <div class="field"><label>Tabelog</label><input id="ep-tabelog" type="number" step="0.01"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Google</label><input id="ep-google" type="number" step="0.1"></div>
        <div class="field"><label>標籤（逗號分隔）</label><input id="ep-tags"></div>
      </div>
      <div class="field"><label>備註</label><textarea id="ep-note" rows="3"></textarea></div>
      <div class="field"><label>Maps 連結</label><input id="ep-maps"></div>
      <div class="field"><label>IG 連結</label><input id="ep-ig"></div>
      <div class="field"><label>Facebook 連結</label><input id="ep-fb"></div>
      <div class="field"><label>Blog 連結</label><input id="ep-blog"></div>
      <div class="field"><label>Tabelog 連結</label><input id="ep-tabelog-link"></div>
      <div class="field" style="display:flex;gap:8px">
        <button class="btn primary" id="savePlaceBtn">儲存地點</button>
        <button class="btn danger" id="deletePlaceBtn">刪除地點</button>
      </div>
    </div>
    <!-- Review Panel -->
    <div id="reviewPanel" style="display:none">
      <div class="mini">儲存後可用「⇩ 匯出 reviews」下載最新 reviews.json。</div>
      <div class="listMini" id="reviewMiniList"></div>
      <div class="field"><label>ID</label><input id="er-id"></div>
      <div class="grid2">
        <div class="field"><label>對應地點 ID</label><input id="er-place-id"></div>
        <div class="field"><label>地點名稱</label><input id="er-place-name"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>來源</label><input id="er-source"></div>
        <div class="field"><label>日期</label><input id="er-date"></div>
      </div>
      <div class="field"><label>總評分</label><input id="er-rating" type="number" step="0.1"></div>
      <div class="field"><label>Google Maps URL</label><input id="er-url"></div>
      <div class="field"><label>評論內容</label><textarea id="er-content" rows="4"></textarea></div>
      <div class="field" style="display:flex;gap:8px">
        <button class="btn primary" id="saveReviewBtn">儲存評論</button>
        <button class="btn danger" id="deleteReviewBtn">刪除評論</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function(){
let placesDoc={places:[]},reviewsDoc={reviews:[]},configDoc={categories:[],prices:[],regions:[],mapDefaults:{center:[33.5904,130.4017],zoom:12}};
let selectedCat='all',selectedRegion='all',selectedPrice='all',q='';
let map,layer,walkCenter=null,walkMinutes=null,walkLayer=null,centerMarker=null,myLocationMarker=null;
let editingPlaceId=null,editingReviewId=null;
const el=id=>document.getElementById(id);
const uniq=arr=>[...new Set((arr||[]).filter(Boolean))];
const isMobile=()=>window.innerWidth<=900;
const metersByMinutes={5:400,10:800,15:1200};
const normPlace=p=>({...p,category:p.category||'',ratings:p.ratings||{tabelog:p.tabelog??null,google:p.grating??null},tags:Array.isArray(p.tags)?p.tags:[],region:p.region||'',price:p.price||''});
const iconMap={'拉麵':'🍜','博多料理':'🍢','居酒屋':'🍺','天婦羅':'🍤','咖啡':'☕','住宿':'🏨','壽司':'🍣','景點':'📍','甜品':'🍰','燒肉':'🥩','麵包':'🥐','烏冬':'🥢','丼飯':'🍚'};

function markerHtml(category){return L.divIcon({html:`<div style="width:28px;height:28px;border-radius:50%;background:#f59e0b;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1">${iconMap[category]||'📍'}</div>`,className:'custom-pin',iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-12]})}

async function loadJson(path,fallback){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return await r.json()}catch{return fallback}}

function syncSidebar(){const hidden=el('sidebar').classList.contains('hidden');if(isMobile()){el('mapOverlay').classList.toggle('show',!hidden)}else{el('sidebar').classList.remove('hidden');el('mapOverlay').classList.remove('show')}}
function closeSidebar(){if(isMobile()){el('sidebar').classList.add('hidden');syncSidebar();setTimeout(()=>map&&map.invalidateSize(),220)}}
function toggleSidebar(){if(isMobile()){el('sidebar').classList.toggle('hidden');syncSidebar()}setTimeout(()=>map&&map.invalidateSize(),220)}

function getTodayStatus(p){const day=new Date().getDay();if(Array.isArray(p.closedDays)&&p.closedDays.includes(day))return{label:'今日休息',cls:'closedBadge'};if(p.irregularClosed)return{label:'不定休',cls:'irregularBadge'};if(p.openingHours)return{label:'有營業資料',cls:'openBadge'};return null}
function haversine(lat1,lng1,lat2,lng2){const R=6371000,toRad=d=>d*Math.PI/180,dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
function insideWalkRange(p){if(!walkCenter||!walkMinutes)return true;if(!Number.isFinite(+p.lat)||!Number.isFinite(+p.lng))return false;return haversine(walkCenter.lat,walkCenter.lng,+p.lat,+p.lng)<=metersByMinutes[walkMinutes]}
function filters(p){const hay=[p.name,p.region,p.category,p.source,(p.tags||[]).join(' ')].join(' ').toLowerCase();return(selectedCat==='all'||p.category===selectedCat)&&(selectedRegion==='all'||p.region===selectedRegion)&&(selectedPrice==='all'||p.price===selectedPrice)&&(!q||hay.includes(q))&&insideWalkRange(p)}

function renderChips(id,values,selected,setter){const box=el(id);box.innerHTML='';[['all','全部'],...values.map(v=>[v,v])].forEach(([val,label])=>{const b=document.createElement('button');b.className='chip'+(selected===val?' on':'');b.textContent=label;b.onclick=()=>{setter(val);renderAll();if(isMobile())closeSidebar()};box.appendChild(b)})}

function renderList(items){const box=el('list');box.innerHTML='';if(!items.length){box.innerHTML='<div class="empty">0 個地點</div>';return}items.forEach(p=>{const s=getTodayStatus(p);const d=document.createElement('div');d.className='card';d.innerHTML=`<h3>${p.name||''}</h3><div class="meta"><span class="badge">${p.category||''}</span><span class="badge">${p.region||''}</span>${p.price?`<span class="badge">${p.price}</span>`:''} ${p.ratings?.tabelog?`<span class="badge rating">Tabelog ${p.ratings.tabelog}</span>`:''} ${p.ratings?.google?`<span class="badge gr">Google ${p.ratings.google}</span>`:''}</div>${s?`<div class="meta"><span class="badge ${s.cls}">${s.label}</span></div>`:''}<div class="hours">${p.openingHours?`營業時間：${p.openingHours}`:'營業時間：未知'}${p.specialClosedNote?`<br>備註：${p.specialClosedNote}`:''}</div><div style="color:#cbd5e1;font-size:13px;margin-top:6px">${(p.tags||[]).join(' · ')}</div>`;d.onclick=()=>{if(map&&Number.isFinite(+p.lat)&&Number.isFinite(+p.lng)){map.flyTo([+p.lat,+p.lng],16,{duration:.5});if(isMobile())closeSidebar()}};box.appendChild(d)})}

function renderMap(items){if(layer){layer.clearLayers()}else{layer=L.markerClusterGroup({showCoverageOnHover:false,spiderfyOnMaxZoom:true,disableClusteringAtZoom:15,maxClusterRadius:42});map.addLayer(layer)}items.forEach(p=>{if(!Number.isFinite(+p.lat)||!Number.isFinite(+p.lng))return;const s=getTodayStatus(p);let popup=`<b>${p.name||''}</b><br>${p.category||''} · ${p.region||''}`;if(p.openingHours)popup+=`<br>營業時間：${p.openingHours}`;if(s)popup+=`<br>${s.label}`;if(p.specialClosedNote)popup+=`<br>${p.specialClosedNote}`;const links=p.links||{};const lparts=[];if(links.maps)lparts.push(`<a href="${links.maps}" target="_blank" rel="noopener">📍 Maps</a>`);if(links.tabelog)lparts.push(`<a href="${links.tabelog}" target="_blank" rel="noopener">🍽 Tabelog</a>`);if(lparts.length)popup+=`<br>${lparts.join(' · ')}`;L.marker([+p.lat,+p.lng],{icon:markerHtml(p.category)}).bindPopup(popup).addTo(layer)});if(layer.getLayers().length&&!walkCenter&&!walkMinutes){map.fitBounds(layer.getBounds().pad(0.15))}}

function drawWalkRange(){if(walkLayer){walkLayer.remove();walkLayer=null}if(centerMarker){centerMarker.remove();centerMarker=null}if(!walkCenter||!walkMinutes)return;walkLayer=L.circle([walkCenter.lat,walkCenter.lng],{radius:metersByMinutes[walkMinutes],color:'#f59e0b',weight:2,fillColor:'#f59e0b',fillOpacity:.12}).addTo(map);centerMarker=L.circleMarker([walkCenter.lat,walkCenter.lng],{radius:6,color:'#fff',weight:2,fillColor:'#f59e0b',fillOpacity:1}).addTo(map)}
function drawMyLocation(lat,lng){if(myLocationMarker){myLocationMarker.remove();myLocationMarker=null}myLocationMarker=L.circleMarker([lat,lng],{radius:8,color:'#fff',weight:2,fillColor:'#3b82f6',fillOpacity:1}).addTo(map).bindPopup('你的位置')}
function setActive(){document.querySelectorAll('[data-range]').forEach(btn=>btn.classList.toggle('on',String(walkMinutes)===btn.dataset.range))}

function renderAll(){const raw=(placesDoc.places||[]).map(normPlace),items=raw.filter(filters);renderChips('catChips',uniq(configDoc.categories?.length?configDoc.categories:raw.map(p=>p.category)),selectedCat,v=>selectedCat=v);renderChips('regionChips',uniq(configDoc.regions?.length?configDoc.regions:raw.map(p=>p.region)),selectedRegion,v=>selectedRegion=v);renderChips('priceChips',uniq(configDoc.prices?.length?configDoc.prices:raw.map(p=>p.price)),selectedPrice,v=>selectedPrice=v);renderList(items);renderMap(items);drawWalkRange();setActive();syncSidebar()}

// ---- Editor ----
function switchTab(tab){el('tabPlace').classList.toggle('on',tab==='place');el('tabReview').classList.toggle('on',tab==='review');el('placePanel').style.display=tab==='place'?'':'none';el('reviewPanel').style.display=tab==='review'?'':'none';if(tab==='place')renderPlaceMiniList();else renderReviewMiniList()}

function renderPlaceMiniList(){const box=el('placeMiniList');box.innerHTML='';(placesDoc.places||[]).forEach(p=>{const d=document.createElement('div');d.className='mitem'+(editingPlaceId===p.id?' on':'');d.textContent=`${p.id} ${p.name||''}`;d.onclick=()=>loadPlaceToForm(p.id);box.appendChild(d)})}

function loadPlaceToForm(id){editingPlaceId=id;const p=(placesDoc.places||[]).find(x=>x.id===id)||{};el('ep-id').value=p.id||'';el('ep-name').value=p.name||'';el('ep-category').value=p.category||'';el('ep-region').value=p.region||'';el('ep-lat').value=p.lat??'';el('ep-lng').value=p.lng??'';el('ep-price').value=p.price||'';el('ep-source').value=p.source||'';el('ep-tabelog').value=p.tabelog??'';el('ep-google').value=p.grating??'';el('ep-tags').value=(p.tags||[]).join(', ');el('ep-note').value=p.note||'';el('ep-maps').value=p.links?.maps||'';el('ep-ig').value=p.links?.ig||'';el('ep-fb').value=p.links?.fb||'';el('ep-blog').value=p.links?.blog||'';el('ep-tabelog-link').value=p.links?.tabelog||'';renderPlaceMiniList()}

function savePlaceFromForm(){const id=el('ep-id').value.trim();if(!id)return alert('ID 不能為空');const obj={id,name:el('ep-name').value.trim(),category:el('ep-category').value.trim(),region:el('ep-region').value.trim(),lat:parseFloat(el('ep-lat').value)||0,lng:parseFloat(el('ep-lng').value)||0,price:el('ep-price').value.trim(),source:el('ep-source').value.trim(),tabelog:parseFloat(el('ep-tabelog').value)||null,grating:parseFloat(el('ep-google').value)||null,tags:el('ep-tags').value.split(',').map(s=>s.trim()).filter(Boolean),note:el('ep-note').value.trim(),links:{maps:el('ep-maps').value.trim()||null,ig:el('ep-ig').value.trim()||null,fb:el('ep-fb').value.trim()||null,blog:el('ep-blog').value.trim()||null,tabelog:el('ep-tabelog-link').value.trim()||null}};const idx=(placesDoc.places||[]).findIndex(p=>p.id===id);if(idx>=0)placesDoc.places[idx]=obj;else placesDoc.places.push(obj);editingPlaceId=id;renderAll();renderPlaceMiniList()}

function deletePlaceFromForm(){const id=el('ep-id').value.trim();if(!id||!confirm(`確定刪除 ${id}？`))return;placesDoc.places=(placesDoc.places||[]).filter(p=>p.id!==id);editingPlaceId=null;renderAll();renderPlaceMiniList()}

function renderReviewMiniList(){const box=el('reviewMiniList');box.innerHTML='';(reviewsDoc.reviews||[]).forEach(r=>{const d=document.createElement('div');d.className='mitem'+(editingReviewId===r.id?' on':'');d.textContent=`${r.id} ${r.placeName||r.placeId||''}`;d.onclick=()=>loadReviewToForm(r.id);box.appendChild(d)})}

function loadReviewToForm(id){editingReviewId=id;const r=(reviewsDoc.reviews||[]).find(x=>x.id===id)||{};el('er-id').value=r.id||'';el('er-place-id').value=r.placeId||'';el('er-place-name').value=r.placeName||'';el('er-source').value=r.source||'';el('er-date').value=r.date||'';el('er-rating').value=r.rating??'';el('er-url').value=r.url||'';el('er-content').value=r.content||'';renderReviewMiniList()}

function saveReviewFromForm(){const id=el('er-id').value.trim();if(!id)return alert('ID 不能為空');const obj={id,placeId:el('er-place-id').value.trim(),placeName:el('er-place-name').value.trim(),source:el('er-source').value.trim(),date:el('er-date').value.trim(),rating:parseFloat(el('er-rating').value)||null,url:el('er-url').value.trim(),content:el('er-content').value.trim()};const idx=(reviewsDoc.reviews||[]).findIndex(r=>r.id===id);if(idx>=0)reviewsDoc.reviews[idx]=obj;else reviewsDoc.reviews.push(obj);editingReviewId=id;renderReviewMiniList()}

function deleteReviewFromForm(){const id=el('er-id').value.trim();if(!id||!confirm(`確定刪除評論 ${id}？`))return;reviewsDoc.reviews=(reviewsDoc.reviews||[]).filter(r=>r.id!==id);editingReviewId=null;renderReviewMiniList()}

function downloadJson(data,filename){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data,null,2));a.download=filename;a.click()}

async function boot(){
  placesDoc=await loadJson('./places.json',{places:[]});
  reviewsDoc=await loadJson('./reviews.json',{reviews:[]});
  configDoc=await loadJson('./config.json',configDoc);
  if(Array.isArray(placesDoc))placesDoc={places:placesDoc};
  if(Array.isArray(reviewsDoc))reviewsDoc={reviews:reviewsDoc};

  map=L.map('map',{zoomControl:false}).setView(configDoc.mapDefaults?.center||[33.5904,130.4017],configDoc.mapDefaults?.zoom||12);
  L.control.zoom({position:'bottomright'}).addTo(map);
  const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}),esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'});
  osm.addTo(map);
  L.control.layers({'街道圖':osm,'衛星圖':esri},null,{position:'topright',collapsed:true}).addTo(map);

  el('search').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();renderAll()});
  el('toggleSide').onclick=toggleSidebar;
  el('toggleSide2').onclick=toggleSidebar;
  el('mapOverlay').onclick=closeSidebar;

  el('exportPlaces').onclick=()=>downloadJson(placesDoc,'places.json');
  el('exportReviews').onclick=()=>downloadJson(reviewsDoc,'reviews.json');
  el('openEditor').onclick=()=>{el('editorDrawer').classList.add('open');switchTab('place')};
  el('closeEditor').onclick=()=>el('editorDrawer').classList.remove('open');
  el('resetData').onclick=async()=>{if(!confirm('重載會覆蓋目前記憶體中的資料，確定？'))return;placesDoc=await loadJson('./places.json',{places:[]});reviewsDoc=await loadJson('./reviews.json',{reviews:[]});if(Array.isArray(placesDoc))placesDoc={places:placesDoc};if(Array.isArray(reviewsDoc))reviewsDoc={reviews:reviewsDoc};renderAll();alert('已重載')};

  el('savePlaceBtn').onclick=savePlaceFromForm;
  el('deletePlaceBtn').onclick=deletePlaceFromForm;
  el('saveReviewBtn').onclick=saveReviewFromForm;
  el('deleteReviewBtn').onclick=deleteReviewFromForm;

  el('importPlaces').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{let d=JSON.parse(ev.target.result);if(Array.isArray(d))d={places:d};placesDoc=d;renderAll();alert('匯入完成')}catch{alert('JSON 格式錯誤')}};r.readAsText(f);e.target.value=''};
  el('importReviews').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{let d=JSON.parse(ev.target.result);if(Array.isArray(d))d={reviews:d};reviewsDoc=d;alert('匯入完成')}catch{alert('JSON 格式錯誤')}};r.readAsText(f);e.target.value=''};

  window.addEventListener('resize',syncSidebar);
  if(isMobile())el('sidebar').classList.add('hidden');
  renderAll();
}
boot();
})();
</script>
</body></html>
