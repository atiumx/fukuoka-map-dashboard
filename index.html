<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fukuoka Map Test</title>
<style>
html,body{margin:0;padding:0;background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:720px;width:100%;background:#111827;border:1px solid #334155;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
h1{margin:0 0 16px;font-size:28px;line-height:1.2;color:#fbbf24}
p{margin:0 0 12px;line-height:1.6}
.code{margin-top:16px;padding:14px 16px;background:#0b1220;border:1px solid #334155;border-radius:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;white-space:pre-wrap;word-break:break-word}
.ok{display:inline-block;padding:6px 10px;border-radius:999px;background:#14532d;color:#dcfce7;font-weight:700;font-size:13px;margin-bottom:14px}
.small{color:#94a3b8;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<div class="ok">STEP CLEAN HTML OK</div>
<h1>全新 index.html 測試頁</h1>
<p>如果你手機見到呢頁，代表 <strong>GitHub Pages、HTML、基本 CSS、基本 JavaScript</strong> 都正常，白畫面問題就唔喺最底層載入，而係你原本 app 內容或外部干擾造成。</p>
<p class="small">呢頁冇用外部字型、冇用 Leaflet、冇用 JSON、冇用第三方 JS。</p>
<div class="code" id="info">Loading...</div>
</div>
<script>
(function(){
  var info = document.getElementById('info');
  var lines = [];
  lines.push('Time: ' + new Date().toString());
  lines.push('UA: ' + navigator.userAgent);
  lines.push('Width: ' + window.innerWidth + 'px');
  lines.push('Height: ' + window.innerHeight + 'px');
  info.textContent = lines.join('\n');
})();
</script>
</body>
</html>
