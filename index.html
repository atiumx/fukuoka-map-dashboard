body{margin:0;font-family:sans-serif;background:#111827;color:#e5e7eb;padding:20px}
.status{background:#1f2937;border:1px solid #334155;border-radius:10px;padding:16px;margin:10px 0}
.ok{color:#86efac}
.err{color:#fca5a5}
</style>
</head>
<body>
<h1 style="color:#fbbf24">手機 Debug 版本</h1>
<div id="output"></div>
<script>
const log=(msg,ok=true)=>{
  const d=document.createElement('div');
  d.className='status '+(ok?'ok':'err');
  d.textContent=msg;
  document.getElementById('output').appendChild(d);
};

try{
  log('✓ HTML 載入成功');
  log('✓ JS 執行中');
  log('✓ 螢幕寬度: '+window.innerWidth+'px');
  log('✓ User Agent: '+navigator.userAgent.substring(0,60));

  // 測試基本 DOM
  const testDiv=document.createElement('div');
  log('✓ DOM 操作正常');

  // 測試 fetch API
  fetch('./places.json',{cache:'no-store'})
    .then(r=>{
      if(r.ok){
        log('✓ places.json 可讀取 (HTTP '+r.status+')');
        return r.json();
      }else{
        log('✗ places.json HTTP '+r.status,false);
      }
    })
    .then(data=>{
      if(data){
        const cnt=Array.isArray(data)?data.length:(data.places?.length||0);
        log('✓ places.json 解析成功，共 '+cnt+' 地點');
      }
    })
    .catch(e=>log('✗ places.json 錯誤: '+e.message,false));

  fetch('./config.json',{cache:'no-store'})
    .then(r=>{
      if(r.ok){
        log('✓ config.json 可讀取 (HTTP '+r.status+')');
      }else{
        log('✗ config.json HTTP '+r.status,false);
      }
    })
    .catch(e=>log('✗ config.json 錯誤: '+e.message,false));

  fetch('./assets/leaflet.js')
    .then(r=>{
      if(r.ok){
        log('✓ assets/leaflet.js 可讀取 (HTTP '+r.status+')');
      }else{
        log('✗ assets/leaflet.js HTTP '+r.status,false);
      }
    })
    .catch(e=>log('✗ leaflet.js 錯誤: '+e.message,false));

  log('✓ 基本測試完成，等待 JSON 載入結果...');

}catch(e){
  log('✗ JS 執行錯誤: '+e.message,false);
}
</script>
